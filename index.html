<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>업무 배정표</title>
  <link rel="stylesheet" href="style.css">

  <!-- Excel 파일 생성용 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<header class="app-header">
  <div>
    <h1>업무 배정표</h1>
    <p>누적 이력을 반영한 자동 업무 배정</p>
  </div>

  <button id="theme-toggle" class="secondary-button" type="button">
    다크모드
  </button>
</header>

<main class="container">

  <!-- 기본 설정 -->
  <section class="card">
    <h2>배정 설정</h2>

    <div class="form-grid">

      <label>
        연도
        <input id="year-input" type="number" min="2020" max="2100" value="2026">
      </label>

      <label>
        월
        <input id="month-input" type="number" min="1" max="12" value="9">
      </label>

      <label>
        시작일
        <input id="start-day-input" type="number" min="1" max="31" value="15">
      </label>

      <label>
        종료일
        <input id="end-day-input" type="number" min="1" max="31" value="30">
      </label>

    </div>

    <button id="generate-button" class="primary-button" type="button">
      배정표 생성
    </button>
  </section>


  <!-- 연차 -->
  <section class="card">
    <div class="section-title-row">
      <div>
        <h2>연차 관리</h2>
        <p>해당 날짜에 근무하지 않는 작업자를 선택합니다.</p>
      </div>
    </div>

    <div class="leave-form">

      <label>
        날짜
        <input id="leave-date-input" type="date">
      </label>

      <div class="worker-checkboxes">
        <label class="checkbox-label">
          <input type="checkbox" value="김" class="leave-worker">
          김
        </label>

        <label class="checkbox-label">
          <input type="checkbox" value="탁" class="leave-worker">
          탁
        </label>

        <label class="checkbox-label">
          <input type="checkbox" value="임" class="leave-worker">
          임
        </label>

        <label class="checkbox-label">
          <input type="checkbox" value="박" class="leave-worker">
          박
        </label>

        <label class="checkbox-label">
          <input type="checkbox" value="류" class="leave-worker">
          류
        </label>
      </div>

      <div class="button-row">
        <button id="save-leave-button" class="primary-button" type="button">
          연차 저장
        </button>

        <button id="delete-leave-button" class="secondary-button" type="button">
          해당 날짜 연차 삭제
        </button>
      </div>

    </div>

    <div id="leave-list" class="leave-list"></div>
  </section>


  <!-- GitHub -->
  <section class="card">
    <div class="section-title-row">
      <div>
        <h2>GitHub 데이터</h2>
        <p>누적 배정 이력을 GitHub의 history.json에 저장할 수 있습니다.</p>
      </div>
    </div>

    <div class="form-grid">

      <label>
        GitHub 사용자명
        <input id="github-owner-input" type="text" placeholder="예: acencoff22-rgb">
      </label>

      <label>
        저장소
        <input id="github-repo-input" type="text" placeholder="예: assignment-app">
      </label>

      <label>
        브랜치
        <input id="github-branch-input" type="text" value="main">
      </label>

      <label>
        데이터 경로
        <input id="github-path-input" type="text" value="data/history.json">
      </label>

    </div>

    <div class="button-row">
      <button id="save-github-settings-button" class="secondary-button" type="button">
        설정 저장
      </button>

      <button id="prepare-github-button" class="primary-button" type="button">
        GitHub 저장 준비
      </button>
    </div>

    <p id="github-status" class="status-text"></p>
  </section>


  <!-- 파일 출력 -->
  <section class="card export-card">
    <div class="section-title-row">
      <div>
        <h2>파일 출력</h2>
        <p>
          Excel 파일은 Google Drive에 업로드한 뒤 Google 스프레드시트로 열 수 있습니다.
        </p>
      </div>
    </div>

    <div class="export-buttons">

      <button id="export-xlsx-button" class="primary-button" type="button">
        Excel (.xlsx)
      </button>

      <button id="export-csv-button" class="secondary-button" type="button">
        CSV
      </button>

      <button id="export-json-button" class="secondary-button" type="button">
        JSON 백업
      </button>

    </div>

    <p id="export-status" class="status-text"></p>
  </section>


  <!-- 달력 -->
  <section class="card calendar-card">

    <div class="calendar-header">

      <button id="previous-month-button" class="icon-button" type="button">
        ‹
      </button>

      <h2 id="calendar-title">2026년 9월</h2>

      <button id="next-month-button" class="icon-button" type="button">
        ›
      </button>

    </div>

    <div id="calendar" class="calendar"></div>

  </section>


  <!-- 생성 결과 -->
  <section class="card">

    <div class="section-title-row">
      <div>
        <h2>배정 결과</h2>
        <p id="result-summary"></p>
      </div>
    </div>

    <div id="schedule-result"></div>

  </section>


  <!-- 누적 현황 -->
  <section class="card">

    <div class="section-title-row">
      <div>
        <h2>누적 업무 현황</h2>
        <p>최근 6개월 상세 이력 + 이전 기간 누적값을 기준으로 표시합니다.</p>
      </div>
    </div>

    <div id="balance-result"></div>

  </section>

</main>


<!-- 날짜 상세 모달 -->
<div id="day-modal" class="modal hidden">

  <div class="modal-backdrop" id="modal-backdrop"></div>

  <div class="modal-content">

    <div class="modal-header">
      <h2 id="modal-title">날짜 상세</h2>

      <button id="modal-close-button" class="icon-button" type="button">
        ×
      </button>
    </div>

    <div id="modal-body"></div>

  </div>

</div>


<div id="toast" class="toast hidden"></div>


<script src="app.js"></script>

</body>
</html>
