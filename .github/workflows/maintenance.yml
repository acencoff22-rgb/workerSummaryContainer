name: Assignment data maintenance

on:
  workflow_dispatch:

  schedule:
    - cron: "17 15 * * *"

  push:
    paths:
      - "data/history.json"
      - "scripts/prune-history.mjs"
      - ".github/workflows/maintenance.yml"

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prune old history
        run: node scripts/prune-history.mjs

      - name: Check changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/history.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit maintenance result
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/history.json

          git commit \
            -m "chore: maintain assignment history"

          git push
